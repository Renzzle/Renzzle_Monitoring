# Loki single-node config (filesystem storage). Data persists in volume loki_data.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  grpc_server_max_concurrent_streams: 1000

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  metric_aggregation_enabled: true
  enable_multi_variant_queries: true
  # 90 days, matching Prometheus. MAU and payment history only reach as far back as this
  retention_period: 2160h
  # A little over the retention so a "last 90 days" query is never refused
  max_query_length: 2232h
  # Counting distinct users per day or per feature groups by user id inside the query, which passes the default 500
  max_query_series: 50000
  # The dashboards ask for counts over whole days to months in one go; split those by day, not the default hour,
  # so a 90-day panel is 90 pieces instead of 2,000
  split_instant_metric_queries_by_interval: 24h

compactor:
  working_directory: /tmp/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

schema_config:
  configs:
    - from: "2020-10-24"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

pattern_ingester:
  enabled: false

ruler:
  alertmanager_url: http://localhost:9093

frontend:
  encoding: protobuf
